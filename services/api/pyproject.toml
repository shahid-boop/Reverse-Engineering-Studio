[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "revstudio-api"
version = "0.1.0"
description = "Local-first API for Reverse Engineering Studio"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1.0","uvicorn[standard]>=0.30,<1.0","python-multipart>=0.0.9","pydantic-settings>=2.5"]
[project.optional-dependencies]
dev = ["pytest>=8.0","httpx>=0.27","ruff>=0.8"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["../../tests/api"]
