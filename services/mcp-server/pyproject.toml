[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "revstudio-mcp"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2.0"]
[project.scripts]
revstudio-mcp = "revstudio_mcp.server:main"
[tool.setuptools.packages.find]
where = ["src"]
